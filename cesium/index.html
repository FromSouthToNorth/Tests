<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesium材质系统示例</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.95/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.95/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Microsoft YaHei', Arial, sans-serif;
    }

    .control-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(42, 42, 42, 0.9);
      padding: 15px;
      border-radius: 5px;
      color: white;
      z-index: 1000;
      max-width: 300px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .control-panel h3 {
      margin-top: 0;
      color: #f0f0f0;
      border-bottom: 1px solid #555;
      padding-bottom: 10px;
    }

    .control-group {
      margin-bottom: 15px;
      border-bottom: 1px solid #555;
      padding-bottom: 10px;
    }

    .control-group:last-child {
      border-bottom: none;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    select,
    input[type="range"],
    input[type="color"] {
      width: 100%;
      margin-bottom: 10px;
    }

    button {
      background: #4CAF50;
      border: none;
      color: white;
      padding: 8px 15px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 4px;
      width: 100%;
    }

    .value-display {
      display: inline-block;
      width: 40px;
      text-align: right;
    }

    .material-info {
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 12px;
    }

    .status {
      color: #4CAF50;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>
  <div class="control-panel">
    <h3>Cesium材质系统示例</h3>

    <div class="control-group">
      <label for="materialType">材质类型:</label>
      <select id="materialType">
        <option value="color">颜色材质 (Color)</option>
        <option value="checkerboard">棋盘格材质 (Checkerboard)</option>
        <option value="stripe">条纹材质 (Stripe)</option>
        <option value="grid">网格材质 (Grid)</option>
        <option value="dot">点状材质 (Dot)</option>
        <option value="image">图像材质 (Image)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="baseColor">基础颜色:</label>
      <input type="color" id="baseColor" value="#ff0000">
    </div>

    <div class="control-group">
      <label for="secondaryColor">次要颜色:</label>
      <input type="color" id="secondaryColor" value="#0000ff">
    </div>

    <div class="control-group">
      <label for="repeat">重复次数: <span id="repeatValue" class="value-display">5</span></label>
      <input type="range" id="repeat" min="1" max="20" value="5">
    </div>

    <div class="control-group">
      <label for="transparency">透明度: <span id="transparencyValue" class="value-display">1.0</span></label>
      <input type="range" id="transparency" min="0" max="1" step="0.1" value="1.0">
    </div>

    <div class="material-info">
      <strong>Cesium材质系统</strong> 允许您为3D对象创建各种视觉效果。
    </div>

    <div class="control-group">
      <button id="applyMaterial">应用材质</button>
      <button id="resetMaterial">重置为默认</button>
    </div>

    <div id="status" class="status">就绪</div>
  </div>

  <script>
    // 使用公开的Cesium Ion令牌（用于演示）
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJiNGNkZmExNi1iNGFjLTRmMWQtYTk0YS1kZDA0YThjODg0YWEiLCJpZCI6MTIzMzI5LCJpYXQiOjE3NTI2NTYwMDV9.AGrRQMfnLy7_rqCkCqt0ESx3NX3ulhfOZLv-sDZB-vA';

    // 初始化Cesium Viewer
    const viewer = new Cesium.Viewer('cesiumContainer', {
      terrainProvider: Cesium.createWorldTerrain(),
      animation: false,
      timeline: false,
      homeButton: false,
      geocoder: false,
      baseLayerPicker: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      fullscreenButton: false
    });

    // 设置初始视角
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(116.4, 39.9, 500000),
      orientation: {
        heading: 0,
        pitch: -0.5,
        roll: 0
      }
    });

    // 创建测试实体（一个平面）
    const testEntity = viewer.entities.add({
      name: '材质演示平面',
      position: Cesium.Cartesian3.fromDegrees(116.4, 39.9, 0),
      plane: {
        dimensions: new Cesium.Cartesian2(200000, 200000),
        material: Cesium.Color.RED.withAlpha(0.8),
        plane: new Cesium.Plane(Cesium.Cartesian3.UNIT_Z, 0.0),
        outline: true,
        outlineColor: Cesium.Color.WHITE
      }
    });

    // 添加说明标签
    viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(116.4, 40.1, 0),
      label: {
        text: '材质演示 - 使用控制面板调整参数',
        font: '16pt Microsoft YaHei',
        fillColor: Cesium.Color.YELLOW,
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 2,
        pixelOffset: new Cesium.Cartesian2(0, -150),
        style: Cesium.LabelStyle.FILL_AND_OUTLINE
      }
    });

    // 创建材质函数
    function createMaterial(type, color1, color2, repeat, transparency) {
      const color = Cesium.Color.fromCssColorString(color1).withAlpha(transparency);
      const secondaryColor = Cesium.Color.fromCssColorString(color2).withAlpha(transparency);

      try {
        switch (type) {
          case 'color':
            return color;

          case 'image':
            // 使用Cesium内置的图像
            return new Cesium.ImageMaterialProperty({
              image: './images/tiles.jpg', // 相对路径，如果不存在会使用默认材质
              repeat: new Cesium.Cartesian2(repeat, repeat)
            });

          case 'checkerboard':
            return new Cesium.CheckerboardMaterialProperty({
              evenColor: color,
              oddColor: secondaryColor,
              repeat: new Cesium.Cartesian2(repeat, repeat)
            });

          case 'stripe':
            return new Cesium.StripeMaterialProperty({
              evenColor: color,
              oddColor: secondaryColor,
              repeat: repeat,
              orientation: Cesium.StripeOrientation.HORIZONTAL
            });

          case 'grid':
            return new Cesium.GridMaterialProperty({
              color: color,
              cellAlpha: 0.2,
              lineCount: new Cesium.Cartesian2(repeat, repeat),
              lineThickness: new Cesium.Cartesian2(2.0, 2.0)
            });

          case 'dot':
            return new Cesium.DotMaterialProperty({
              color: color,
              repeat: repeat
            });

          default:
            return color;
        }
      } catch (error) {
        console.error('创建材质时出错:', error);
        return Cesium.Color.RED; // 出错时返回默认颜色
      }
    }

    // 应用材质函数
    function applyMaterial() {
      try {
        const materialType = document.getElementById('materialType').value;
        const baseColor = document.getElementById('baseColor').value;
        const secondaryColor = document.getElementById('secondaryColor').value;
        const repeat = parseInt(document.getElementById('repeat').value);
        const transparency = parseFloat(document.getElementById('transparency').value);

        const material = createMaterial(materialType, baseColor, secondaryColor, repeat, transparency);

        // 更新实体材质
        if (testEntity.plane) {
          testEntity.plane.material = material;
        }

        document.getElementById('status').textContent = `已应用: ${materialType}`;
        console.log('材质应用成功:', materialType);
      } catch (error) {
        console.error('应用材质时出错:', error);
        document.getElementById('status').textContent = '错误: ' + error.message;
      }
    }

    // 重置材质函数
    function resetMaterial() {
      document.getElementById('materialType').value = 'color';
      document.getElementById('baseColor').value = '#ff0000';
      document.getElementById('secondaryColor').value = '#0000ff';
      document.getElementById('repeat').value = 5;
      document.getElementById('transparency').value = 1.0;
      document.getElementById('repeatValue').textContent = 5;
      document.getElementById('transparencyValue').textContent = 1.0;

      applyMaterial();
      document.getElementById('status').textContent = '已重置为默认设置';
    }

    // 绑定事件
    document.getElementById('applyMaterial').addEventListener('click', applyMaterial);
    document.getElementById('resetMaterial').addEventListener('click', resetMaterial);

    document.getElementById('repeat').addEventListener('input', function () {
      document.getElementById('repeatValue').textContent = this.value;
    });

    document.getElementById('transparency').addEventListener('input', function () {
      document.getElementById('transparencyValue').textContent = this.value;
    });

    // 当材质类型改变时自动应用
    document.getElementById('materialType').addEventListener('change', applyMaterial);
    document.getElementById('baseColor').addEventListener('change', applyMaterial);
    document.getElementById('secondaryColor').addEventListener('change', applyMaterial);

    // 初始应用材质
    setTimeout(() => {
      applyMaterial();
      document.getElementById('status').textContent = '初始化完成';
    }, 1000);

    // 添加调试信息
    viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(116.4, 39.7, 0),
      label: {
        text: '调试信息区域',
        font: '12pt Microsoft YaHei',
        fillColor: Cesium.Color.WHITE,
        pixelOffset: new Cesium.Cartesian2(0, 100),
      }
    });
  </script>
</body>

</html>
