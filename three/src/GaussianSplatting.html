<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高斯泼溅加载器</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
      z-index: 100;
    }

    #controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
      z-index: 100;
    }

    button {
      background: #4CAF50;
      border: none;
      color: white;
      padding: 8px 16px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background: #45a049;
    }

    input[type="range"] {
      width: 150px;
    }

    .slider-container {
      margin: 5px 0;
    }
  </style>
</head>

<body>
  <div id="container">
    <div id="info">
      <h3>高斯泼溅加载器</h3>
      <p>鼠标拖动旋转 • 滚轮缩放 • 右键平移</p>
    </div>
    <div id="controls">
      <div class="slider-container">
        <label for="pointSize">点大小: </label>
        <input type="range" id="pointSize" min="0.1" max="20" value="1" step="0.1">
        <span id="pointSizeValue">1.0</span>
      </div>
      <div class="slider-container">
        <label for="opacity">不透明度: </label>
        <input type="range" id="opacity" min="0" max="1" value="0.8" step="0.01">
        <span id="opacityValue">0.8</span>
      </div>
      <div class="slider-container">
        <label for="pointCount">点数: </label>
        <input type="range" id="pointCount" min="1000" max="100000" value="50000" step="1000">
        <span id="pointCountValue">50000</span>
      </div>
      <button id="resetView">重置视图</button>
      <button id="regenerate">重新生成</button>
    </div>
  </div>

  <!-- 使用兼容性最好的版本 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>

  <script>
    // 初始化Three.js场景
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111122);

    // 相机设置
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(3, 3, 3);
    camera.lookAt(0, 0, 0);

    // 渲染器设置
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('container').appendChild(renderer.domElement);
    console.log(THREE.OrbitControls);


    // 轨道控制器 - 使用全局THREE对象
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = false;
    controls.minDistance = 1;
    controls.maxDistance = 50;

    // 添加光源
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(5, 5, 5);
    scene.add(directionalLight);

    // 高斯泼溅点云对象
    let pointCloud = null;

    // 高斯随机数生成器
    function gaussianRandom(mean = 0, stdDev = 1) {
      let u = 1 - Math.random();
      let v = Math.random();
      let z = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
      return z * stdDev + mean;
    }

    // 生成高斯泼溅数据
    function generateGaussianSplatData(pointCount = 50000) {
      const positions = new Float32Array(pointCount * 3);
      const colors = new Float32Array(pointCount * 3);
      const sizes = new Float32Array(pointCount);

      // 创建几个高斯分布的中心点
      const centers = [
        { x: -1.5, y: 0, z: 0, color: [1, 0.2, 0.2] },
        { x: 1.5, y: 0, z: 0, color: [0.2, 0.8, 0.2] },
        { x: 0, y: 1.5, z: 0, color: [0.2, 0.5, 1] },
        { x: 0, y: -1.5, z: 0, color: [0.8, 0.2, 0.8] }
      ];

      for (let i = 0; i < pointCount; i++) {
        // 随机选择一个中心点
        const center = centers[Math.floor(Math.random() * centers.length)];

        // 生成高斯分布的位置
        const x = gaussianRandom(center.x, 0.8);
        const y = gaussianRandom(center.y, 0.8);
        const z = gaussianRandom(center.z, 0.8);

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        // 基于中心点颜色，添加一些随机变化
        colors[i * 3] = center.color[0] + (Math.random() - 0.5) * 0.3;
        colors[i * 3 + 1] = center.color[1] + (Math.random() - 0.5) * 0.3;
        colors[i * 3 + 2] = center.color[2] + (Math.random() - 0.5) * 0.3;

        // 大小基于到中心的距离（越远越小）
        const dx = x - center.x;
        const dy = y - center.y;
        const dz = z - center.z;
        const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);
        sizes[i] = Math.max(0.02, 0.1 - distance * 0.03);
      }

      return { positions, colors, sizes };
    }

    // 创建高斯泼溅可视化
    function createGaussianSplat(pointCount = 50000) {
      // 移除现有的点云
      if (pointCloud) {
        scene.remove(pointCloud);
        pointCloud.geometry.dispose();
        pointCloud.material.dispose();
      }

      const data = generateGaussianSplatData(pointCount);

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(data.positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(data.colors, 3));
      geometry.setAttribute('size', new THREE.BufferAttribute(data.sizes, 1));

      const material = new THREE.PointsMaterial({
        vertexColors: true,
        size: 0.08,
        transparent: true,
        opacity: 0.8,
        sizeAttenuation: true,
        blending: THREE.AdditiveBlending
      });

      pointCloud = new THREE.Points(geometry, material);
      scene.add(pointCloud);
    }

    // 初始化创建高斯泼溅
    createGaussianSplat(50000);

    // UI控制
    const pointSizeSlider = document.getElementById('pointSize');
    const pointSizeValue = document.getElementById('pointSizeValue');
    const opacitySlider = document.getElementById('opacity');
    const opacityValue = document.getElementById('opacityValue');
    const pointCountSlider = document.getElementById('pointCount');
    const pointCountValue = document.getElementById('pointCountValue');
    const resetButton = document.getElementById('resetView');
    const regenerateButton = document.getElementById('regenerate');

    pointSizeSlider.addEventListener('input', function () {
      const size = parseFloat(this.value);
      pointSizeValue.textContent = size.toFixed(1);
      if (pointCloud) {
        pointCloud.material.size = size * 0.01;
      }
    });

    opacitySlider.addEventListener('input', function () {
      const opacity = parseFloat(this.value);
      opacityValue.textContent = opacity.toFixed(2);
      if (pointCloud) {
        pointCloud.material.opacity = opacity;
      }
    });

    pointCountSlider.addEventListener('input', function () {
      const count = parseInt(this.value);
      pointCountValue.textContent = count.toLocaleString();
    });

    regenerateButton.addEventListener('click', function () {
      const count = parseInt(pointCountSlider.value);
      createGaussianSplat(count);
    });

    resetButton.addEventListener('click', function () {
      controls.reset();
    });

    // 窗口调整大小
    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 动画循环
    function animate() {
      requestAnimationFrame(animate);

      // 轻微旋转点云，增强视觉效果
      if (pointCloud) {
        pointCloud.rotation.y += 0.001;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    console.log('高斯泼溅加载器已启动！');
  </script>
</body>

</html>
