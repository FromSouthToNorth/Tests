<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>OpenStreetMap 瓦片加载与 iD 风格编辑</title>
  <style>
    body {
      margin: 0;
    }

    svg {
      width: 100vw;
      height: 100vh;
    }

    image {
      image-rendering: optimizeSpeed;
    }

    .point {
      fill: #ff4444;
      stroke: #fff;
      stroke-width: 2;
      r: 6;
      filter: url(#point-shadow);
      cursor: pointer;
    }

    .point:hover,
    .point.selected {
      fill: #ff9900;
      r: 8;
    }

    .line {
      fill: none;
      stroke: #1e90ff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#line-shadow);
      cursor: pointer;
    }

    .line:hover,
    .line.selected {
      stroke: #ff9900;
      stroke-width: 4;
    }

    .polygon {
      fill: rgba(30, 144, 255, 0.3);
      stroke: #1e90ff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#line-shadow);
      cursor: pointer;
    }

    .polygon:hover,
    .polygon.selected {
      fill: rgba(255, 153, 0, 0.4);
      stroke: #ff9900;
      stroke-width: 4;
    }

    .temp-line {
      fill: none;
      stroke: #888;
      stroke-dasharray: 5;
      stroke-width: 2;
    }

    button {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      padding: 8px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
    }

    #mode-point {
      left: 10px;
    }

    #mode-line {
      left: 100px;
    }

    #mode-polygon {
      left: 190px;
    }
  </style>
</head>

<body>
  <button id="mode-point">点模式</button>
  <button id="mode-line">线模式</button>
  <button id="mode-polygon">多边形模式</button>
  <svg>
    <!-- 定义阴影滤镜 -->
    <defs>
      <filter id="point-shadow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3" />
      </filter>
      <filter id="line-shadow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.2" />
      </filter>
    </defs>
  </svg>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-tile@1"></script>
  <script>
    // 设置画布尺寸
    const width = window.innerWidth;
    const height = window.innerHeight;

    // 初始化 SVG
    const svg = d3.select("svg")
      .attr("width", width)
      .attr("height", height);

    // 创建投影（Web Mercator）
    const projection = d3.geoMercator()
      .scale((1 << 12) / (2 * Math.PI))
      .translate([width / 2, height / 2]);

    // 创建路径生成器
    const path = d3.geoPath().projection(projection);

    // 创建瓦片生成器
    const tile = d3.tile()
      .size([width, height])
      .scale(1 << 12)
      .translate([width / 2, height / 2]);

    // 初始化缩放行为，禁用默认双击缩放
    const zoom = d3.zoom()
      .scaleExtent([1 << 8, 1 << 20])
      .on("zoom", zoomed);

    svg.call(zoom);

    // 创建图层
    const raster = svg.append("g").attr("class", "raster");
    const vector = svg.append("g").attr("class", "vector");
    const eventLayer = svg.append("g").attr("class", "event-layer"); // 用于双击事件的图层


    // 数据存储
    let points = []; // [[lon, lat], ...]
    let lines = [];  // [[[lon1, lat1], [lon2, lat2], ...], ...]
    let polygons = []; // [[[lon1, lat1], [lon2, lat2], ..., [lon1, lat1]], ...]
    let mode = null;
    let currentLine = [];
    let selected = null; // 选中的元素 {type: 'point'|'line'|'polygon', index: number}

    // 模式切换
    d3.select("#mode-point").on("click", () => setMode('point'));
    d3.select("#mode-line").on("click", () => setMode('line'));
    d3.select("#mode-polygon").on("click", () => setMode('polygon'));

    function setMode(newMode) {
      mode = newMode;
      currentLine = [];
      selected = null;
      updateTempLine();
      updateAll();
      console.log(`模式切换到: ${mode}`);
    }

    // 点击事件（绘制）
    svg.on("click", function (event) {
      if (!mode) return;
      const [x, y] = d3.pointer(event);
      const [lon, lat] = projection.invert([x, y]);

      if (mode === 'point') {
        points.push([lon, lat]);
        updatePoints();
      } else if (mode === 'line' || mode === 'polygon') {
        currentLine.push([lon, lat]);
        updateTempLine();
      }
    });

    svg.on("contextmenu", function (event) {
      event.preventDefault();
      mode = null; // 取消当前模式
    });

    // 双击事件（绑定到 eventLayer）
    eventLayer.append("rect")
      .attr("width", width)
      .attr("height", height)
      .attr("fill", "none")
      .attr("pointer-events", "all")
      .on("dblclick", function (event) {
        event.stopPropagation();
        event.preventDefault();
        console.log("双击触发", mode, currentLine);
        if (mode === 'line' && currentLine.length >= 2) {
          lines.push([...currentLine]);
          currentLine = [];
          updateLines();
          updateTempLine();
        } else if (mode === 'polygon' && currentLine.length >= 3) {
          const closed = [...currentLine, currentLine[0]];
          polygons.push(closed);
          currentLine = [];
          updatePolygons();
          updateTempLine();
        }
      });
    // 鼠标移动（临时线）
    svg.on("mousemove", function (event) {
      if (currentLine.length > 0) {
        const [x, y] = d3.pointer(event);
        const [lon, lat] = projection.invert([x, y]);
        updateTempLine([lon, lat]);
      }
    });

    // 拖拽行为
    const drag = d3.drag()
      .on("start", function (event, d) {
        selected = { type: 'point', index: points.indexOf(d) };
        updatePoints();
      })
      .on("drag", function (event, d) {
        const [lon, lat] = projection.invert([event.x, event.y]);
        points[points.indexOf(d)] = [lon, lat];
        updatePoints();
        // 更新包含该点的线/多边形
        lines.forEach(line => {
          line.forEach((p, i) => {
            if (p === d) line[i] = [lon, lat];
          });
        });
        polygons.forEach(polygon => {
          polygon.forEach((p, i) => {
            if (p === d) polygon[i] = [lon, lat];
          });
        });
        updateLines();
        updatePolygons();
      })
      .on("end", function () {
        updatePoints();
      });

    // 更新临时线
    function updateTempLine(mousePos) {
      vector.selectAll(".temp-line").remove();
      if (currentLine.length > 0) {
        let tempPoints = [...currentLine];
        if (mousePos) tempPoints.push(mousePos);
        const lineGen = d3.line()
          .x(d => projection(d)[0])
          .y(d => projection(d)[1]);
        vector.append("path")
          .attr("class", "temp-line")
          .attr("d", lineGen(tempPoints));
      }
    }

    // 更新点
    function updatePoints() {
      vector.selectAll("circle").data(points)
        .join("circle")
        .attr("class", d => `point ${selected && selected.type === 'point' && selected.index === points.indexOf(d) ? 'selected' : ''}`)
        .attr("cx", d => projection(d)[0])
        .attr("cy", d => projection(d)[1])
        .call(drag)
        .on("mouseover", function () { d3.select(this).classed("hover", true); })
        .on("mouseout", function () { d3.select(this).classed("hover", false); })
        .on("click", function (event, d) {
          event.stopPropagation(); // 防止触发 SVG 的点击
          selected = { type: 'point', index: points.indexOf(d) };
          updateAll();
        });
    }

    // 更新线
    function updateLines() {
      vector.selectAll(".line").data(lines)
        .join("path")
        .attr("class", (d, i) => `line ${selected && selected.type === 'line' && selected.index === i ? 'selected' : ''}`)
        .attr("d", d => path({ type: "LineString", coordinates: d }))
        .on("mouseover", function () { d3.select(this).classed("hover", true); })
        .on("mouseout", function () { d3.select(this).classed("hover", false); })
        .on("click", function (event, d, i) {
          event.stopPropagation();
          selected = { type: 'line', index: lines.indexOf(d) };
          updateAll();
        });
    }

    // 更新多边形
    function updatePolygons() {
      vector.selectAll(".polygon").data(polygons)
        .join("path")
        .attr("class", (d, i) => `polygon ${selected && selected.type === 'polygon' && selected.index === i ? 'selected' : ''}`)
        .attr("d", d => path({ type: "Polygon", coordinates: [d] }))
        .on("mouseover", function () { d3.select(this).classed("hover", true); })
        .on("mouseout", function () { d3.select(this).classed("hover", false); })
        .on("click", function (event, d, i) {
          event.stopPropagation();
          selected = { type: 'polygon', index: polygons.indexOf(d) };
          updateAll();
        });
    }

    // 更新所有元素
    function updateAll() {
      updatePoints();
      updateLines();
      updatePolygons();
    }

    // 缩放和平移
    function zoomed(event) {
      const transform = event.transform;
      projection
        .scale(transform.k / (2 * Math.PI))
        .translate([transform.x, transform.y]);

      const tiles = tile
        .scale(transform.k)
        .translate([transform.x, transform.y])();

      raster.attr("transform", `translate(${tiles.translate[0] * tiles.scale}, ${tiles.translate[1] * tiles.scale}) scale(${tiles.scale / 256})`);

      const image = raster.selectAll("image")
        .data(tiles, d => `${d[0]}-${d[1]}-${d[2]}`);

      image.exit().remove();

      image.enter().append("image")
        .attr("xlink:href", d => `https://tile.openstreetmap.org/${d[2]}/${d[0]}/${d[1]}.png`)
        .attr("x", d => d[0] * 256)
        .attr("y", d => d[1] * 256)
        .attr("width", 256)
        .attr("height", 256)
        .attr("opacity", 0)
        .transition()
        .duration(200)
        .attr("opacity", 1);

      updateAll();
      updateTempLine();
    }

    // 初始化地图（伦敦）
    svg.call(zoom.transform, d3.zoomIdentity
      .translate(width / 2, height / 2)
      .scale(1 << 12));

    // 添加署名
    svg.append("text")
      .attr("x", 10)
      .attr("y", height - 10)
      .attr("font-size", "12px")
      .text("© OpenStreetMap contributors");
  </script>
</body>

</html>
