<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../src/css/leaflet.css" />
  <script src="../src/leaflet/leaflet.js"></script>
  <script src="../src/turf.js"></script>
  <script src="../src/rbush.js"></script>
  <style>
    .map-info {
      padding: 6px;
      position: absolute;
      left: 10px;
      bottom: 10px;
      background-color: #fff;
      color: #000;
      z-index: 9999;
    }

    .polygon-flash {
      animation: flash 1.5s infinite;
    }

    @keyframes flash {

      0%,
      100% {
        opacity: 1;
        fill-opacity: 0.8;
      }

      50% {
        opacity: 0.2;
        fill-opacity: 0;
      }
    }

    .polygon-bbox {
      animation: bbox 1.5s infinite;
    }

    @keyframes bbox {

      0%,
      100% {
        opacity: 0.9;
      }

      50% {
        opacity: 0.6;
      }
    }
  </style>
  <title>Document</title>
</head>

<body>
  <div id="map-container">
  </div>
  <div class="map-info">
  </div>
  <script>
    const map = L.map('map-container', {
      center: [30.6600, 104.0633],
      zoom: 14,
      layers: [
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 26,
          attribution: '© OpenStreetMap'
        })
      ]
    });
    function getCoord(point) {
      return turf.getCoord(point);
    }
    function truncate(latLng, precision = 7, coordinates = 3) {
      const point = turf.truncate(turf.point([latLng.lng, latLng.lat]), { precision, coordinates })
      return point
    }
    function truncateLatlng(latlng, precision = 7, coordinates = 3) {
      const point = truncate(latlng, precision, coordinates)
      const coord = getCoord(point)
      return {
        lat: coord[1],
        lng: coord[0],
      }
    }
    function getMapInfo() {
      const bounds = map.getBounds();
      const nwLatLng = truncateLatlng(bounds.getNorthWest())
      const swLatLng = truncateLatlng(bounds.getSouthWest())
      const seLatLng = truncateLatlng(bounds.getSouthEast())
      const neLatLng = truncateLatlng(bounds.getNorthEast())
      const bbox = `${nwLatLng.lng},${swLatLng.lat},${seLatLng.lng},${neLatLng.lat}`
      const mapInfo = document.getElementsByClassName('map-info')
      mapInfo[0].innerHTML = `<p>获取的经纬度范围: ${bbox}</p><p>层级: ${map.getZoom()}</p><p>中心：${map.getCenter().toString()}</p>`
    }
    getMapInfo()

    map.on('moveend', () => getMapInfo())
    console.log('西北: ', map.getBounds().getNorthWest());
    console.log('西南: ', map.getBounds().getSouthWest());
    console.log('东南: ', map.getBounds().getSouthEast());
    console.log('东北: ', map.getBounds().getNorthEast());
    const nwLatLng = map.getBounds().getNorthWest() // 西北
    const swLatLng = map.getBounds().getSouthWest() // 西南
    const seLatLng = map.getBounds().getSouthEast() // 东南
    const neLatLng = map.getBounds().getNorthEast() // 东北

    const latlngs = [
      {
        "lat": 30.6684069200956,
        "lng": 104.04269456863405
      },
      {
        "lat": 30.651591616757496,
        "lng": 104.04269456863405
      },
      {
        "lat": 30.651591616757496,
        "lng": 104.0838932991028
      },
      {
        "lat": 30.6684069200956,
        "lng": 104.0838932991028
      }
    ]
    const featureLayers = L.featureGroup().addTo(map);
    L.polygon(latlngs, {
      color: 'red',
      weight: 1,
      fillOpacity: 0.1
    }).addTo(featureLayers);

    const layerNumber = 365

    const layerTree = new RBush();

    const points = turf.randomPoint(layerNumber, { bbox: [104.0608252, 30.6598847, 104.065975, 30.6619866] });
    const className = 'myTooltip';
    turf.featureEach(points, function (feature, index) {
      const { geometry, properties } = feature
      const { coordinates } = geometry;
      const id = `${geometry.type}_${index + 1}`
      properties.name = id;
      properties.id = id;
      layerTree.insert({
        minX: coordinates[0],
        minY: coordinates[1],
        maxX: coordinates[0],
        maxY: coordinates[1],
        id,
        feature
      });
    });
    const pointGeoJSON = L.geoJSON(points.features, {
      onEachFeature: function (feature, layer) {
        layer.bindTooltip(feature.properties.name, {
          permanent: true,
          className,
        })
      }
    }).on('click', ({ sourceTarget }) => {
      console.log('click sourceTarget: ', sourceTarget);
    }).addTo(map);

    let bboxPolygon

    const polygons = turf.randomPolygon(80, { bbox: [104.10653114318849, 30.61789683754099, 104.27132606506349, 30.655043514787806], num_vertices: 4, max_radial_length: 0.006 });
    turf.featureEach(polygons, function (feature, index) {
      const id = `${feature.geometry.type}_${index + 1}`
      feature.properties.name = `${id} ${turf.area(feature)} m2`;
      feature.properties.id = id;
      const bbox = turf.bbox(feature)
      layerTree.insert({
        minX: bbox[0],
        minY: bbox[1],
        maxX: bbox[2],
        maxY: bbox[3],
        id,
        feature
      });
    });
    const polygonGeoJSON = L.geoJSON(polygons.features, {
      // onEachFeature: function (feature, layer) {
      //   layer.bindTooltip(feature.properties.name, {
      //     permanent: true,
      //     className,
      //   })
      // },
      style: {
        color: '#1677ff',
        weight: 2,
        fillOpacity: 0.1
      }
    }).on('mouseover', ({ sourceTarget }) => {
      const bbox = turf.bbox(sourceTarget.feature)
      bboxPolygon = L.GeoJSON.geometryToLayer(turf.bboxPolygon(bbox))
      bboxPolygon.setStyle({
        color: '#f5222d',
        weight: 1,
        fillOpacity: 0,
        className: 'polygon-bbox'
      });
      bboxPolygon.addTo(map);
      bboxPolygon.bringToBack();
    }).on('mouseout', ({ sourceTarget }) => {
      if (bboxPolygon && map.hasLayer(bboxPolygon)) {
        map.removeLayer(bboxPolygon);
      }
    }).on('click', ({ sourceTarget }) => {
      console.log('click sourceTarget: ', sourceTarget);
    }).addTo(map);

    const { features } = polygons

    const intersectsLayers = []

    const intersectsTree = new RBush();

    for (const layer of features) {
      const _bbox = turf.bbox(layer)
      const bbox = {
        minX: _bbox[0],
        minY: _bbox[1],
        maxX: _bbox[2],
        maxY: _bbox[3],
        id: layer.properties.id
      }
      const seaRes = layerTree.search(bbox);
      if (seaRes.length) {
        for (const item of seaRes) {
          if (item.id === bbox.id) continue;
          const intersects = turf.intersect(layer, item.feature);
          if (intersects) {
            // const _bbox = turf.bbox(intersects);
            // const intersectBbox = {
            //   minX: _bbox[0],
            //   minY: _bbox[1],
            //   maxX: _bbox[2],
            //   maxY: _bbox[3],
            //   id: `${layer.properties.id}/${item.feature.properties.id}`
            // }
            // intersectsTree.insert(intersectBbox);
            intersectsLayers.push(intersects);
          }
        }
      }
    }

    console.log('intersectsLayers: ', intersectsLayers);

    const intersectsGeoJSON = L.geoJSON(intersectsLayers, {
      style: {
        color: '#f5222d',
        weight: 6,
        fillOpacity: 0.8,
        className: 'polygon-flash'
      }
    }).addTo(map)
    intersectsGeoJSON.bringToBack()
    treeSearch()

    function treeSearch() {
      const bounds = map.getBounds();
      console.log('bounds:', bounds);
      const nwLatLng = bounds.getNorthWest()
      const swLatLng = bounds.getSouthWest()
      const seLatLng = bounds.getSouthEast()
      const neLatLng = bounds.getNorthEast()
      console.log(`${nwLatLng.lng},${swLatLng.lat},${seLatLng.lng},${neLatLng.lat}`);
      const res = layerTree.search({
        minX: nwLatLng.lng,
        minY: swLatLng.lat,
        maxX: seLatLng.lng,
        maxY: neLatLng.lat
      })
      console.log('res: ', res);
    }

    map.on('moveend', () => treeSearch())

    const tooltipTree = new RBush()

    // 如何优化这段代码将时间复杂度从N2次方降为NlogN
    function hideOverlappingTooltips() {
      const tooltips = [...document.getElementsByClassName(className)];
      if (tooltips.length === 0) return;

      // Initialize R-tree
      const tree = new RBush();

      // Collect rectangles and sort by y-coordinate (rect.top) for priority
      const rects = tooltips
        .map((tooltip, index) => {
          tooltip.style.visibility = '';
          const rect = tooltip.getBoundingClientRect();
          return {
            rect,
            index,
            visible: true,
            // RBush expects minX, minY, maxX, maxY
            box: {
              minX: rect.left,
              minY: rect.top,
              maxX: rect.right,
              maxY: rect.bottom,
              index // Store index for reference
            }
          };
        })
        .sort((a, b) => a.rect.top - b.rect.top); // Sort by y-coordinate

      // Insert rectangles into R-tree
      tree.load(rects.map(({ box }) => box));

      // Check for overlaps, prioritizing tooltips with smaller y-coordinates
      rects.forEach((current, sortedIndex) => {
        if (!current.visible) return;

        // Query R-tree for potential overlaps
        const overlaps = tree
          .search({
            minX: current.rect.left,
            minY: current.rect.top,
            maxX: current.rect.right,
            maxY: current.rect.bottom
          })
          .filter(box => box.index !== current.index); // Exclude self

        // Hide overlapping tooltips with lower priority (higher sortedIndex)
        overlaps.forEach(overlap => {
          const overlapIndex = rects.findIndex(r => r.index === overlap.index);
          if (overlapIndex > sortedIndex) {
            // Current tooltip has higher priority (smaller y-coordinate)
            rects[overlapIndex].visible = false;
            // Remove from R-tree to prevent further checks
            tree.remove(overlap);
          } else if (overlapIndex < sortedIndex && current.visible) {
            // Current tooltip has lower priority, hide it
            current.visible = false;
          }
        });
      });

      // Apply visibility to DOM
      rects.forEach(({ index, visible }) => {
        tooltips[index].style.visibility = visible ? '' : 'hidden';
      });
    }
    hideOverlappingTooltips()

    map.on('zoomend', () => { hideOverlappingTooltips() });

  </script>

</body>

</html>
